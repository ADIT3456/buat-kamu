<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untukmu 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ffe6ea 0%, #ffb6c1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Mencegah scrollbar saat tombol kabur */
            color: #d81b60;
        }

        /* Animasi Jejak Hati (Heart Trail) */
        .heart-trail {
            position: absolute;
            pointer-events: none;
            font-size: 24px;
            animation: floatUp 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -150px) scale(0.5) rotate(20deg);
            }
        }

        /* Kontainer Halaman */
        .page {
            display: none;
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(216, 27, 96, 0.2);
            backdrop-filter: blur(10px);
            max-width: 90%;
            width: 500px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 10;
        }

        .page.active {
            display: block;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #c2185b;
            line-height: 1.2;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #c2185b;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #ad1457;
        }

        /* Tombol */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px; /* Ruang agar tombol yang kabur tidak merusak layout */
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-yes {
            background: #ff4081;
            color: white;
        }

        .btn-yes:hover {
            background: #e91e63;
            transform: scale(1.05);
        }

        .btn-no {
            background: #f5f5f5;
            color: #757575;
            position: relative;
        }

        /* Galeri Foto */
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            border: 3px solid #ffb6c1;
            aspect-ratio: 1 / 1;
            background-color: #ffe6ea;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(194, 24, 91, 0.8);
            color: white;
            padding: 8px;
            font-size: 0.9rem;
            text-align: center;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover .gallery-caption {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Halaman 1: Penembakan -->
    <div id="page1" class="page active">
        <h1>Maukah kamu jadi pacarku?</h1>
        <p>Aku sangat menyukaimu dan ingin kamu jadi milikku. 🥺👉👈</p>
        <div class="btn-container" id="btnContainer">
            <button class="btn-yes" id="yesBtn">Mau banget! 💖</button>
            <button class="btn-no" id="noBtn">Gak, menjauh dariku</button>
        </div>
    </div>

    <!-- Halaman 2: Galeri Foto -->
    <div id="page2" class="page">
        <h2>Yeyyy! Keputusan Terbaik! 🎉</h2>
        <p>Aku orang paling bahagia sekarang. Mulai hari ini, ayo kita buat lebih banyak kenangan indah berdua! 💕</p>
        
        <!-- Galeri -->
        <div class="gallery">
            <!-- Ganti atribut 'src' dengan link atau path foto kalian berdua -->
            <div class="gallery-item">
                <img src="https://cdn.phototourl.com/free/2026-07-07-d749e555-67c9-46e0-b300-f955e353f9fa.jpg" alt="Foto 1">
                <div class="gallery-caption">kamuu lucu</div>
            </div>
            <div class="gallery-item">
                <img src="https://cdn.phototourl.com/free/2026-07-07-9910e976-210c-4405-8a5f-0ecbff79aeb1.jpg" alt="Foto 2">
                <div class="gallery-caption">momen di dc✨</div>
            </div>
            <div class="gallery-item">
                <img src="https://cdn.phototourl.com/free/2026-07-07-b1782084-4f5d-430a-bdb1-24b90e78bd07.jpg" alt="Foto 3">
                <div class="gallery-caption">lucuuuuu imuttt</div>
            </div>
            <div class="gallery-item">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGbPiILZ9yqvmbI1VVh5nzkZS2kLuhleeoGn2f5d6VJg&s=10" alt="Foto 4">
                <div class="gallery-caption">hero fav kamu</div>
            </div>
        </div>
    </div>

    <script>
        // 1. Logika Animasi Jejak Hati (Cursor Heart Trail)
        document.addEventListener('mousemove', function(e) {
            // Membatasi jumlah hati yang muncul agar tidak lag
            if (Math.random() > 0.4) return;

            const heart = document.createElement('div');
            heart.innerHTML = '💖';
            heart.className = 'heart-trail';
            
            // Menyesuaikan posisi agar pas di tengah kursor
            heart.style.left = (e.pageX - 10) + 'px';
            heart.style.top = (e.pageY - 10) + 'px';
            
            document.body.appendChild(heart);
            
            // Hapus elemen setelah animasi selesai
            setTimeout(() => {
                heart.remove();
            }, 1000);
        });

        // 2. Logika Tombol "Gak" yang Kabur
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        
        const moveButton = () => {
            // Ubah posisi menjadi fixed agar bisa bergerak bebas di seluruh layar
            noBtn.style.position = 'fixed';
            noBtn.style.zIndex = '999';

            // Hitung batas maksimal layar dikurangi ukuran tombol agar tidak keluar layar
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            // Hasilkan koordinat acak
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            // Terapkan koordinat baru
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        };

        // Pemicu tombol kabur saat kursor mendekat (Desktop) atau disentuh (Mobile)
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Mencegah tombol tidak sengaja terklik di HP
            moveButton();
        });

        // 3. Logika Perpindahan Halaman
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');

        // Pindah ke Halaman 2 (Galeri) saat klik "Mau banget!"
        yesBtn.addEventListener('click', () => {
            page1.classList.remove('active');
            page2.classList.add('active');
            noBtn.style.display = 'none'; // Sembunyikan tombol 'Gak' yang kabur agar layar bersih
        });
    </script>
</body>
</html>
